<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test : compteurs asynchrones</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--tx:#17211c;--mut:#5b6862;--ac:#0f6b4f;--acx:#fff;--bad:#b3261e;--bd:#d5dbd6;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#121714;--card:#1a211d;--tx:#e6ece8;--mut:#98a59d;--ac:#4fc298;--acx:#06251a;--bad:#ff8a80;--bd:#2f3a34}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:680px;margin:0 auto;padding:16px}
h1{font:700 1.55rem/1.25 Georgia,"Times New Roman",serif;margin:8px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:12px 0}
.mut{color:var(--mut)}
.big{font:700 2.6rem/1.1 Georgia,serif;margin:8px 0;font-variant-numeric:tabular-nums}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text]{width:100%;padding:10px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px}
button{font:inherit;font-weight:600;padding:12px 18px;border-radius:8px;border:0;background:var(--ac);color:var(--acx);cursor:pointer;margin-top:14px}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:calc(8px + env(safe-area-inset-top,0)) 16px 8px;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
#bar b{font-size:1.15rem}
#bar.low b{color:var(--bad)}
fieldset{border:1px solid var(--bd);border-radius:10px;background:var(--card);margin:12px 0;padding:12px 14px}
legend{font-weight:700;padding:0 6px;max-width:100%}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-radius:6px;cursor:pointer}
.opt:has(input:checked){background:color-mix(in srgb,var(--ac) 14%,transparent)}
.opt input{margin-top:5px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;font-size:.9rem}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){button{transition:opacity .15s}button:active{opacity:.8}}
.fig{overflow-x:auto;margin:6px 0}.fig svg{min-width:320px;max-width:100%;height:auto;color:var(--tx)}
</style>
</head>
<body>

<div id="bar" hidden><span id="prog"></span><span>Temps restant : <b id="left"></b></span></div>

<main>
  <h1 id="titre"></h1>

  <section id="wait" class="card" hidden>
    <p>Le test n’est pas encore ouvert. Il commence le <b id="wdate"></b>.</p>
    <div class="big" id="wcount"></div>
    <p class="mut">Cette page s’ouvrira automatiquement à l’heure prévue. Gardez-la ouverte.</p>
  </section>

  <section id="login" class="card" hidden>
    <p id="info"></p>
    <label for="nom">Nom et post-nom</label>
    <input type="text" id="nom" autocomplete="name">
    <label for="classe">Classe</label>
    <input type="text" id="classe" placeholder="ex. 3H EQ">
    <p id="err" class="mut" style="color:var(--bad)"></p>
    <button id="go">Commencer le test</button>
  </section>

  <form id="quiz" hidden onsubmit="return false">
    <div id="qs"></div>
    <button id="fin" type="button">Terminer et voir ma cote</button>
  </form>

  <section id="closed" class="card" hidden>
    <p><b>Le test est terminé.</b> L’accès est fermé.</p>
    <p class="mut">Si vous n’avez pas pu le passer, contactez votre professeur.</p>
  </section>

  <section id="result" class="card" hidden>
    <p class="mut" id="rwho"></p>
    <div class="big" id="rnote"></div>
    <p id="rpct"></p>
    <p>Envoyez ce code de résultat à votre professeur :</p>
    <div class="code" id="rcode"></div>
    <button class="sec" id="copy">Copier le code</button>
  </section>
</main>

<script>
/* =====================================================================
   CONFIGURATION : seule partie à modifier pour chaque nouveau test
   ===================================================================== */
const CONFIG = {
  titre: "Test : les compteurs asynchrones",
  debut: "2026-11-28T08:00",   // date et heure de début : AAAA-MM-JJTHH:MM (heure locale)
  dureeMinutes: 30,           // durée du test ; l’accès se ferme à début + durée
  questions: [
    // Q("question", figure ou null, ["A","B","C","D"], indice de la bonne réponse (0 = premier choix)) ; chaque question vaut 1 point
    // figure : {n:3} compteur à n bascules ; ajoutez dn:1 pour un décompteur ; rst:[1,2] pour une remise à zéro par NAND sur Q1 et Q2
    Q("Dans un compteur asynchrone, le signal d’horloge est appliqué :",null,["À toutes les bascules en même temps","Uniquement à la première bascule ; chaque bascule suivante est commandée par la sortie de la précédente","Uniquement à la dernière bascule","À une bascule sur deux"],1),
    Q("Un autre nom du compteur asynchrone est :",null,["Compteur synchrone","Compteur en anneau","Compteur à propagation (ripple counter)","Compteur de Johnson"],2),
    Q("Pour qu’une bascule JK fonctionne en diviseur de fréquence par 2, on impose :",null,["J = 0 et K = 0","J = 1 et K = 1","J = 1 et K = 0","J = 0 et K = 1"],1),
    Q("Quel est le modulo du compteur asynchrone de la figure ?",{n:3},["3","6","8","16"],2),
    Q("Quelle est la valeur maximale de comptage du compteur de la figure (de 0 à ...) ?",{n:4},["4","8","15","16"],2),
    Q("Le signal d’entrée H de la figure a une fréquence de 8 kHz. Quelle est la fréquence du signal sur Q2 ?",{n:3},["8 kHz","4 kHz","2 kHz","1 kHz"],3),
    Q("Le compteur de la figure est en état Q3Q2Q1Q0 = 0101. Après la prochaine impulsion d’horloge, son état est :",{n:4},["0100","0110","0111","1010"],1),
    Q("Les bascules de la figure sont chaînées par leurs sorties Q̄. Ce compteur est un :",{n:3,dn:1},["Compteur modulo 6","Compteur synchrone","Décompteur","Compteur en anneau"],2),
    Q("Le décompteur de la figure est dans l’état Q2Q1Q0 = 101. Après une impulsion d’horloge, son état est :",{n:3,dn:1},["110","100","101","001"],1),
    Q("Dans la figure, les sorties Q1 et Q2 commandent une porte NAND reliée aux entrées CLR (actives à 0). Quel est le modulo de ce compteur ?",{n:3,rst:[1,2]},["4","5","6","8"],2),
    Q("Dans la figure, les sorties Q1 et Q3 commandent une porte NAND reliée aux entrées CLR. Ce compteur compte de 0 à :",{n:4,rst:[1,3]},["7","9","10","15"],1),
    Q("Pour réaliser un compteur modulo 12 avec 4 bascules, la porte NAND de remise à zéro doit être reliée à :",null,["Q0 et Q1","Q1 et Q2","Q2 et Q3","Q0 et Q3"],2),
    Q("Quel est le nombre minimal de bascules nécessaires pour réaliser un compteur modulo 100 ?",null,["5","6","7","10"],2),
    Q("Pour un compteur modulo N à n bascules, la condition à respecter est :",null,["N ≥ 2ⁿ","2ⁿ ≥ N","n = N","n ≥ 2N"],1),
    Q("Un compteur modulo 10 reçoit une horloge de 50 kHz. La fréquence du signal de fin de cycle est :",null,["500 kHz","10 kHz","5 kHz","500 Hz"],2),
    Q("Quel est le rôle de l’entrée CLR d’une bascule ?",null,["Mettre la sortie Q à 0 de façon asynchrone","Inverser la sortie Q","Bloquer l’horloge","Mettre la sortie Q à 1"],0),
    Q("Le principal inconvénient du compteur asynchrone est :",null,["Il nécessite plus de bascules","Il ne compte qu’en binaire pur","Il consomme trop de courant","Le cumul des temps de propagation des bascules"],3),
    Q("Chaque bascule d’un compteur à 4 bascules a un temps de propagation de 20 ns. Le temps maximal pour que toutes les sorties se stabilisent est :",null,["20 ns","40 ns","80 ns","160 ns"],2),
    Q("Un compteur asynchrone de 4 bascules a un temps de propagation de 25 ns par bascule. Sa fréquence d’horloge maximale est environ :",null,["10 MHz","40 MHz","4 MHz","100 MHz"],0),
    Q("Quelle est la différence essentielle avec un compteur synchrone ?",null,["Le compteur synchrone n’utilise pas de bascules","Dans le compteur synchrone, toutes les bascules reçoivent la même horloge","Le compteur synchrone est toujours plus lent","Le compteur synchrone ne peut pas décompter"],1)
  ]
};
/* ===================== fin de la configuration ===================== */

const $ = id => document.getElementById(id);
const DEB = new Date(CONFIG.debut).getTime();
const FIN = DEB + CONFIG.dureeMinutes * 60000;
const TOTAL = CONFIG.questions.reduce((s, q) => s + q.points, 0);
const KEY = "test_" + CONFIG.debut;
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const p2 = n => String(n).padStart(2, "0");
function dur(ms) {
  const t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return (h ? h + " h " : "") + p2(m) + " min " + p2(s) + " s";
}
function clock(ms) {
  const t = Math.max(0, Math.floor(ms / 1000));
  return p2(Math.floor(t / 60)) + ":" + p2(t % 60);
}
const fmtDate = ms => new Date(ms).toLocaleString("fr-FR", { dateStyle: "full", timeStyle: "short" });

$("titre").textContent = CONFIG.titre;
$("wdate").textContent = fmtDate(DEB);
$("info").textContent = CONFIG.questions.length + " questions, " + TOTAL + " points, " + CONFIG.dureeMinutes +
  " minutes. Le test se ferme automatiquement le " + fmtDate(FIN) + ". Une seule tentative.";

let built = false, current = "";
function show(id) {
  if (current === id) return;
  current = id;
  ["wait", "login", "quiz", "closed", "result"].forEach(s => $(s).hidden = s !== id);
  $("bar").hidden = id !== "quiz";
}

function Q(q,fig,choix,bonne){return{q,fig,choix,bonne,points:1};}
function fig(s){
  const n=s.n,W=n*110+30,H=s.rst?190:125,T=[];
  let o='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Compteur asynchrone à '+n+' bascules JK" fill="none" stroke="currentColor" stroke-width="1.6" font-family="system-ui,sans-serif" font-size="13"><path d="M4 75H20"/><text x="2" y="66" fill="currentColor" stroke="none">H</text>';
  for(let i=0;i<n;i++){
    const x=20+i*110,y=s.dn?95:55;
    o+='<rect x="'+x+'" y="40" width="70" height="70" rx="3"/><path d="M'+x+' 68l9 7-9 7"/>';
    o+='<g fill="currentColor" stroke="none"><text x="'+(x+8)+'" y="56">J=1</text><text x="'+(x+8)+'" y="104">K=1</text><text x="'+(x+30)+'" y="80">JK</text><text x="'+(x+73)+'" y="51">Q'+i+'</text><text x="'+(x+73)+'" y="91">Q\u0304'+i+'</text></g>';
    o+='<path d="M'+(x+70)+' '+y+'H'+(x+90)+'V75'+(i<n-1?'H'+(x+110):'')+'"/>';
    if(s.rst){o+='<circle cx="'+(x+35)+'" cy="114" r="3.5"/><text x="'+(x+42)+'" y="124" fill="currentColor" stroke="none" font-size="11">CLR</text>';}
    if(s.rst&&s.rst.includes(i))T.push(x+90);
  }
  if(s.rst){
    const a=Math.min(...T),b=Math.max(...T),m=(a+b)/2;
    T.forEach(t=>{o+='<path d="M'+t+' 75V150"/><circle cx="'+t+'" cy="75" r="2.5" fill="currentColor"/>';});
    o+='<path d="M'+a+' 150H'+b+'M'+m+' 150V158"/><rect x="'+(m-28)+'" y="158" width="56" height="26" rx="3"/><text x="'+(m-18)+'" y="176" fill="currentColor" stroke="none">NAND</text><text x="'+(m+34)+'" y="176" fill="currentColor" stroke="none" font-size="11">→ CLR</text>';
  }
  return o+'</svg>';
}
function build() {
  if (built) return;
  built = true;
  S.rep = S.rep || {};
  const box = $("qs");
  CONFIG.questions.forEach((q, i) => {
    const f = document.createElement("fieldset");
    const l = document.createElement("legend");
    l.textContent = (i + 1) + ". " + q.q + " (" + q.points + " pt" + (q.points > 1 ? "s" : "") + ")";
    f.appendChild(l);if(q.fig){const d=document.createElement("div");d.className="fig";d.innerHTML=fig(q.fig);f.appendChild(d);}
    q.choix.forEach((c, j) => {
      const lab = document.createElement("label");
      lab.className = "opt";
      const r = document.createElement("input");
      r.type = "radio"; r.name = "q" + i; r.value = j;
      r.checked = S.rep[i] === j;
      r.addEventListener("change", () => { S.rep[i] = j; save(); count(); });
      const sp = document.createElement("span");
      sp.textContent = c;
      lab.append(r, sp);
      f.appendChild(lab);
    });
    box.appendChild(f);
  });
  count();
}
function count() {
  const n = Object.keys(S.rep || {}).length;
  $("prog").textContent = "Répondu : " + n + "/" + CONFIG.questions.length;
}

function checksum(str) {
  let h = 7;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 1000003;
  return h.toString(36).toUpperCase();
}

function submit() {
  if (S.done) return;
  let note = 0;
  CONFIG.questions.forEach((q, i) => { if (S.rep && S.rep[i] === q.bonne) note += q.points; });
  S.done = true; S.note = note;
  S.fait = Math.min(Date.now(), FIN);
  save();
  showResult();
}
function showResult() {
  const d = new Date(S.fait || Date.now());
  const base = [S.nom, S.classe, S.note + "/" + TOTAL, d.toLocaleDateString("fr-FR") + " " + p2(d.getHours()) + ":" + p2(d.getMinutes())].join(" | ");
  $("rwho").textContent = S.nom + " (" + S.classe + ")";
  $("rnote").textContent = S.note + " / " + TOTAL;
  $("rpct").textContent = "Soit " + Math.round(S.note / TOTAL * 100) + " %.";
  $("rcode").textContent = base + " | " + checksum(base);
  show("result");
}

$("go").addEventListener("click", () => {
  const nom = $("nom").value.trim(), classe = $("classe").value.trim();
  if (!nom || !classe) { $("err").textContent = "Entrez votre nom et votre classe pour commencer."; return; }
  S.nom = nom; S.classe = classe; S.started = true; S.rep = S.rep || {};
  save(); build(); show("quiz");
});
$("fin").addEventListener("click", () => {
  const manque = CONFIG.questions.length - Object.keys(S.rep || {}).length;
  if (manque && !confirm(manque + " question(s) sans réponse. Terminer quand même ?")) return;
  submit();
});
$("copy").addEventListener("click", async () => {
  const t = $("rcode").textContent;
  try { await navigator.clipboard.writeText(t); $("copy").textContent = "Code copié"; }
  catch (e) {
    const r = document.createRange(); r.selectNodeContents($("rcode"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    $("copy").textContent = "Code sélectionné : copiez-le";
  }
});

function tick() {
  const now = Date.now();
  if (S.done) { if (current !== "result") showResult(); return; }
  if (now < DEB) { show("wait"); $("wcount").textContent = dur(DEB - now); return; }
  if (now >= FIN) {
    if (S.started) submit(); else show("closed");
    return;
  }
  if (!S.started) { show("login"); return; }
  build(); show("quiz");
  $("left").textContent = clock(FIN - now);
  $("bar").classList.toggle("low", FIN - now < 120000);
}
tick();
setInterval(tick, 500);
</script>
</body>
</html>
